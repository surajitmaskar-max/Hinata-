name: Build & Verify Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Configure Signing & Environment Secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Inject Google Services JSON for Firebase if configured in GitHub Secrets
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Successfully restored app/google-services.json from GitHub Secrets"
          elif [ -f "app/google-services.json.example" ]; then
            cp app/google-services.json.example app/google-services.json
            echo "Using placeholder google-services.json for CI compilation"
          fi

          # Inject Release Signing Keystore if configured in GitHub Secrets
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.jks
            echo "Successfully restored release keystore from GitHub Secrets"
          fi

          # Configure local.properties with Gemini API key
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> local.properties
          else
            echo "GEMINI_API_KEY=PLACEHOLDER_KEY_FOR_CI" >> local.properties
          fi

      - name: Run Unit Tests & Lint
        run: ./gradlew test --stacktrace

      - name: Assemble Release APK
        env:
          KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_BASE64 && 'keystore/release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'PLACEHOLDER_KEY_FOR_CI' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Generated APK
        id: verify_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not generated in app/build/outputs/apk/release/"
            exit 1
          fi
          echo "Found generated APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          # Create a standardized named copy for clean artifact download
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/HINATA-AI-release.apk
          ls -lh artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HINATA-AI-release-apk
          path: artifacts/HINATA-AI-release.apk
          retention-days: 14
