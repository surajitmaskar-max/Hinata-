name: Publish Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          set -e
          echo "=========================================================="
          echo "Configuring Android SDK Environment for HINATA AI Release..."
          echo "Target API: 35 | Build-Tools: 35.0.0 | MinSdk: 26"
          echo "=========================================================="

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f -perm /111 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found or not executable in $ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi

          echo "Using sdkmanager binary at: $SDKMANAGER"

          # Accept all existing licenses
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # Install exact required components
          echo "Installing platforms;android-35 build-tools;35.0.0 platform-tools..."
          if ! "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "cmdline-tools;latest"; then
            echo "::error::Android SDK component installation failed!"
            "$SDKMANAGER" --list_installed || true
            exit 1
          fi

          # Accept newly introduced licenses
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          echo "Android SDK configured successfully for release!"

      - name: Grant Execute Permission
        run: |
          chmod +x ./gradlew
          # Verify that gradle/wrapper/gradle-wrapper.jar exists and is valid
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::warning::gradle/wrapper/gradle-wrapper.jar missing. Restoring official Gradle 8.9 wrapper jar..."
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: Verify Gradle Wrapper
        run: |
          echo "=========================================================="
          echo "Verifying Gradle Wrapper version..."
          echo "=========================================================="
          ./gradlew --version

      - name: Verify Project Configuration
        run: |
          echo "=========================================================="
          echo "Verifying project tasks & build configuration..."
          echo "=========================================================="
          ./gradlew tasks

      - name: Configure Signing & Environment Secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          elif [ -f "app/google-services.json.example" ]; then
            cp app/google-services.json.example app/google-services.json
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.jks
          fi

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> local.properties
          else
            echo "GEMINI_API_KEY=PLACEHOLDER_KEY_FOR_CI" >> local.properties
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_BASE64 && 'keystore/release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'PLACEHOLDER_KEY_FOR_CI' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Assets
        id: prepare_assets
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Searching for generated release APK for tag: $TAG_NAME..."
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release/"
            ls -R app/build/outputs/ || true
            exit 1
          fi

          TARGET_APK="HINATA-AI-${TAG_NAME}-release.apk"
          cp "$RAW_APK" "$TARGET_APK"
          echo "Release APK prepared: $TARGET_APK"
          echo "release_apk=$TARGET_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$TARGET_APK"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HINATA-AI-${{ github.ref_name }}-apk
          path: ${{ steps.prepare_assets.outputs.release_apk }}
          retention-days: 30

      - name: Generate Release Notes & Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HINATA AI ${{ github.ref_name }}
          files: ${{ steps.prepare_assets.outputs.release_apk }}
          draft: false
          prerelease: false
          body: |
            ## 🌟 HINATA AI ${{ github.ref_name }}

            Welcome to the official release of **HINATA AI** — Your Intelligent World personal Android AI assistant!
            **Created & Developed by Surajit Naskar**.

            ### 🚀 What's New & Included
            - 🔮 **Premium Purple Orb UI**: Holographic glowing plasma sphere with audio-reactive animations, tilted planetary rings, and 6 active states.
            - 🎙️ **Multilingual Anime Voice Personality Engine**: Trilingual support in **Bengali (বাংলা)**, **Hindi (हिन्दी)**, and **English**, featuring cheerful pitch/rate inflection and lip sync synchronization.
            - 🧠 **Gemini API Neural Integration**: Direct multimodal AI reasoning powered by Google Generative AI with safe client orchestration.
            - 🔒 **Firebase Authentication & Multi-User Data Isolation**: Secure guest and account login with private user data isolation on Cloud Firestore.
            - ⚡ **Android Phone Automation**: Hardware flashlight control, volume/brightness modulation, phone call and SMS composition with explicit security confirmation.
            - 🛡️ **Personal AI Memory Vault**: User-approved personal preferences and contextual facts securely stored and editable.
            - 📱 **Always-On Background Assistant & Wake-Word**: Foreground service with microphone privacy badge and local "Hey HINATA" keyword detection.

            ### 📦 Download & Install
            1. Download the attached **`${{ steps.prepare_assets.outputs.release_apk }}`** directly to your Android device.
            2. Open the APK and allow *Install from Unknown Sources* if prompted.
            3. Grant the required Audio & Accessibility permissions during onboarding.
            4. Enjoy your personalized HINATA AI companion!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
